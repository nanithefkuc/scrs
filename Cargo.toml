[package]
name = "srs"
description = "Systematic Reed-Solomon erasure coding, optimized for first-packet-to-data-ready latency."
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/nanithefkuc/srs"
homepage = "https://github.com/nanithefkuc/srs"
# Not published. `srs` is taken on crates.io, and both dependencies are git-only
# — `fff` there is an unrelated abandoned `ff` fork for prime-field ZK work, not
# this crate's binary-field library. Consume via a git dependency.
publish = false

[dependencies]
fff = { git = "https://github.com/nanithefkuc/fff.git", version = "0.1.1", default-features = false, features = ["std"] }
cafft = { git = "https://github.com/nanithefkuc/cafft.git", version = "0.1.1", default-features = false, features = ["std", "rs"] }

[features]
default = ["simd"]
# Enable runtime-dispatched SIMD kernels in fff (payload arithmetic) and cafft
# (additive-FFT butterflies). Disabling leaves the portable scalar backends.
simd = ["fff/simd", "cafft/simd"]
# Expose unstable implementation APIs for experimentation and downstream tuning.
# These APIs are exempt from SRS's public compatibility guarantees.
internals = ["cafft/internals", "fff/internals"]

[dev-dependencies]
# Integration tests and benches assert against the field bases directly; a normal
# dependency is not in scope for a `tests/` target. Same source as the lib dependency,
# so cargo unifies it rather than building a second copy.
fff = { git = "https://github.com/nanithefkuc/fff.git", version = "0.1.1", default-features = false, features = ["std"] }
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "decoder_latency"
harness = false

[[bench]]
name = "encoder_latency"
harness = false

[[bench]]
name = "e2e_latency"
harness = false

[[bench]]
name = "engines"
harness = false

[lints.rust]
unsafe_code = "warn"
missing_docs = "warn"
