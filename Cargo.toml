[package]
name = "scrs"
description = "Streaming Cauchy Reed-Solomon erasure coding, optimized for first-packet-to-data-ready latency."
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/nanithefkuc/scrs"

[features]
default = ["simd", "gf256-tables"]
# Enable runtime-dispatched SIMD payload kernels.
simd = []
# Use compile-time log/exp tables (~1 KiB) for fast GF(256) multiplication.
# When disabled, field operations use the portable shift-and-XOR backend.
gf256-tables = []
# Expose unstable implementation APIs for experimentation and downstream tuning.
# These APIs are exempt from SCRS's public compatibility guarantees.
internals = []

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "decoder_latency"
harness = false

[[bench]]
name = "encoder_latency"
harness = false

[[bench]]
name = "e2e_latency"
harness = false

[[bench]]
name = "tower_vs_afft"
harness = false

[lints.rust]
unsafe_code = "warn"
missing_docs = "warn"
