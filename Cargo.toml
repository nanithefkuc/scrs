[package]
name = "srs"
description = "Systematic Reed-Solomon erasure coding, optimized for first-packet-to-data-ready latency."
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/nanithefkuc/srs"
homepage = "https://github.com/nanithefkuc/srs"
# Not published. `srs` is taken on crates.io, and its ecosystem dependencies
# are git-only. Consume via a git dependency.
publish = false

[dependencies]
fgf = { git = "https://github.com/nanithefkuc/fgf", rev = "d0e331cec2e6ae5645e529597fa913db467a44cd", default-features = false, features = ["std"] }
cafft = { path = "../cafft", default-features = false, features = ["std", "rs"] }
gfm = { path = "../gfm", default-features = false, features = ["std"] }

[features]
default = ["simd"]
# Enable runtime-dispatched SIMD kernels in fgf (payload arithmetic), cafft
# (additive-FFT butterflies), and gfm. Disabling leaves portable scalar backends.
simd = ["fgf/simd", "cafft/simd", "gfm/simd"]
# Expose unstable implementation APIs for experimentation and downstream tuning.
# These APIs are exempt from SRS's public compatibility guarantees.
internals = ["cafft/internals", "fgf/internals", "gfm/internals"]

[dev-dependencies]
# Integration tests and benches assert against the field bases directly. Same
# source as the library dependency, so Cargo unifies it into one package.
fgf = { git = "https://github.com/nanithefkuc/fgf", rev = "d0e331cec2e6ae5645e529597fa913db467a44cd", default-features = false, features = ["std"] }
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "decoder_latency"
harness = false

[[bench]]
name = "encoder_latency"
harness = false

[[bench]]
name = "e2e_latency"
harness = false

[[bench]]
name = "engines"
harness = false

[[bench]]
name = "afft_crossover"
harness = false

[lints.rust]
unsafe_code = "warn"
missing_docs = "warn"
